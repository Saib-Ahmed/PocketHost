buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0")
    }
}

// Ensure autolinking.json is always present in root build directory for ReactPlugin
def autolinkingDir = file("${buildDir}/generated/autolinking")
if (!autolinkingDir.exists()) {
    autolinkingDir.mkdirs()
}
def autolinkingFile = file("${autolinkingDir}/autolinking.json")
if (!autolinkingFile.exists()) {
    def sourceConfig = file("autolinking.json")
    if (sourceConfig.exists()) {
        autolinkingFile.text = sourceConfig.text
    } else {
        autolinkingFile.text = '{"reactNativeVersion":"0.88.1","dependencies":{},"project":{"android":{"packageName":"com.pockethost"}}}'
    }
}

ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 26
    compileSdkVersion = 35
    targetSdkVersion = 35
    ndkVersion = "26.1.10909125"
    kotlinVersion = "2.2.0"
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
